general {
    # Native quickshell lockscreen (replaces hyprlock). hypridle is the logind listener: every
    # `loginctl lock-session` (keybind, session menu, before_sleep, idle on-timeout) emits logind's
    # Lock signal, hypridle runs lock_cmd, which pokes the shell's `lock` IPC. Non-blocking (returns
    # immediately) — inhibit_sleep=3 below still holds the delay inhibitor until the compositor
    # reports the ext-session-lock active, so the machine never sleeps unlocked.
    lock_cmd                = ~/.config/velumeron/assets/scripts/lock.sh lock
    before_sleep_cmd        = loginctl lock-session
    # Retries dpms-on until every output reports powered — a single dispatch can
    # fire before the displays finished re-initializing and leaves them dark.
    after_sleep_cmd         = ~/.config/velumeron/assets/scripts/resume-wake.sh
    # Hold the sleep inhibitor until the compositor reports the session lock as
    # active — hyprlock's GPU context is fully up before the system enters S3.
    inhibit_sleep           = 3
}

# No listeners here any more. The idle chain — screensaver → lock → suspend — is driven by
# quickshell/IdleService.qml through the ext-idle-notify-v1 protocol, so it works on any Wayland
# compositor and is configured in Settings → Screensaver instead of in this file. What remains
# above is only the logind bridge: the Lock signal and the sleep inhibitor.
